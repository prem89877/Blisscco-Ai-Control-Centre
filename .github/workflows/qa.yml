name: QA Playwright

# Manual only. Browser tests run on GitHub's servers, so nothing heavy runs on the phone.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Site to test (https://...). Leave empty to use secret QA_BASE_URL'
        required: false

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QA_BASE_URL: ${{ inputs.base_url || secrets.QA_BASE_URL }}
      QA_PATHS: ${{ secrets.QA_PATHS }}
      QA_PROTECTED_PATHS: ${{ secrets.QA_PROTECTED_PATHS }}
      QA_LOGIN_PATH: ${{ secrets.QA_LOGIN_PATH }}
      QA_ADVERTISER_EMAIL: ${{ secrets.QA_ADVERTISER_EMAIL }}
      QA_ADVERTISER_PASSWORD: ${{ secrets.QA_ADVERTISER_PASSWORD }}
      QA_ADVERTISER_LANDING: ${{ secrets.QA_ADVERTISER_LANDING }}
      QA_PUBLISHER_EMAIL: ${{ secrets.QA_PUBLISHER_EMAIL }}
      QA_PUBLISHER_PASSWORD: ${{ secrets.QA_PUBLISHER_PASSWORD }}
      QA_PUBLISHER_LANDING: ${{ secrets.QA_PUBLISHER_LANDING }}
      QA_ADMIN_EMAIL: ${{ secrets.QA_ADMIN_EMAIL }}
      QA_ADMIN_PASSWORD: ${{ secrets.QA_ADMIN_PASSWORD }}
      QA_ADMIN_LANDING: ${{ secrets.QA_ADMIN_LANDING }}
      QA_CRAWL_MAX: ${{ secrets.QA_CRAWL_MAX }}
      QA_ADVERTISER_FORBIDDEN: ${{ secrets.QA_ADVERTISER_FORBIDDEN }}
      QA_PUBLISHER_FORBIDDEN: ${{ secrets.QA_PUBLISHER_FORBIDDEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check target
        run: |
          if [ -z "$QA_BASE_URL" ]; then echo "No base_url input and no QA_BASE_URL secret"; exit 1; fi
          case "$QA_BASE_URL" in https://*) ;; *) echo "Only https targets"; exit 1;; esac
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run tests (desktop + mobile)
        working-directory: e2e
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
